<!doctype html>
<html lang="en-CA"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Signal / SPS Console Lab</title><link rel="stylesheet" href="/common.css" /><link rel="stylesheet" href="/signal/style.css" /></head><body>
<noscript><div class="noscript">Schulich Press Start. <a href="http://127.0.0.1:4322/">Open the current website</a> or <a href="/">return to the console lab</a>.</div></noscript>
<section id="boot" class="boot" aria-label="Signal startup"></section>
<main id="shell" class="signal-system" inert>
  <div class="signal-scene"><canvas id="stage" aria-label="SPS handheld, drag to rotate" tabindex="0"></canvas><img id="stage-fallback" src="/media/handheld.webp" alt="SPS handheld colour concept" /></div>
  <header class="console-header"><a class="console-wordmark" href="/"><img src="/media/logo-white.png" alt="Schulich Press Start" /><span>Signal</span></a><div class="console-clock"><time data-date></time> &nbsp; <time data-clock></time></div><div id="system-tools" class="system-tools"></div></header>
  <div class="signal-content"><p class="signal-greeting">A world built from the inside out.</p><nav class="crossbar" aria-label="System categories"></nav><section class="signal-selection" aria-labelledby="selection-title"><div class="signal-rule"></div><div class="selection-copy"><span class="program-status">SPS / Hardware</span><h1 id="selection-title">The handheld.</h1><p id="selection-description">Two working prototypes.<br>A Game Boy-inspired build next.</p><div class="signal-commands"></div></div></section></div>
  <div class="signal-model-controls"><span>Enclosure study / Colour concept</span><div class="signal-colours" aria-label="Shell colours"></div><button class="orbit-button" type="button" title="Rotate the handheld" aria-label="Rotate the handheld"></button></div>
  <footer class="system-footer"><span>Schulich Press Start · University of Calgary</span><div class="footer-links"><a href="/playroom/">Playroom</a><a href="/cartridge/">Cartridge Club</a></div></footer>
</main><dialog id="panel" class="system-panel"></dialog><script type="module" src="/signal/main.js"></script></body></html>
