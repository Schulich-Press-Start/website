<!doctype html>
<html lang="en-CA"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex,nofollow" /><title>Playroom / SPS Console Lab</title><link rel="stylesheet" href="/common.css" /><link rel="stylesheet" href="/playroom/style.css" /></head><body>
<noscript><div class="noscript">Schulich Press Start. <a href="http://127.0.0.1:4322/">Open the current website</a> or <a href="/">return to the console lab</a>.</div></noscript>
<section id="boot" class="boot" aria-label="Playroom startup"></section>
<main id="shell" class="playroom-system" inert>
  <header class="console-header"><a class="console-wordmark" href="/"><img src="/media/logo-dark.png" alt="Schulich Press Start" /><span>Playroom</span></a><div id="system-tools" class="system-tools"></div></header>
  <section class="channel-heading"><div><p>Schulich Press Start</p><h1>A place to build and play.</h1></div><div class="channel-time"><time data-clock></time><span data-date></span></div></section>
  <section class="channel-home" aria-label="Channel menu"><div class="channel-grid" role="group" aria-label="Programs"></div><div class="channel-paging"><button type="button" class="icon-button" data-page="previous" aria-label="Previous channel page" title="Previous page"></button><div class="channel-dots" aria-label="Channel pages"></div><button type="button" class="icon-button" data-page="next" aria-label="Next channel page" title="Next page"></button></div></section>
  <footer class="playroom-dock"><div class="dock-id"><span class="player-dot">P</span><span>Everyone's invited.</span></div><button class="dock-home" type="button" aria-label="First channel page" title="Home"></button><a href="http://127.0.0.1:4322/">Current website <span class="dock-arrow"></span></a></footer>
</main><dialog id="panel" class="system-panel"></dialog><script type="module" src="/playroom/main.js"></script></body></html>
