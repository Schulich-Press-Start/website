name: Website checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install locked console dependencies
        run: npm ci --prefix .local/console-lab
      - name: Check types
        run: npm run check
      - name: Validate content and assets
        run: npm run test:unit
      - name: Build static website
        run: npm run build
      - name: Build console comparison
        run: node .local/console-lab/build.mjs
      - name: Build public website
        run: node .local/console-lab/build.mjs --site
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test browser behavior and accessibility
        run: npm run test:e2e
      - name: Test compiled console comparison
        run: node .local/console-lab/verify-publish.mjs
      - name: Test public website
        run: node .local/console-lab/verify-site.mjs
      - name: Retain browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain public website screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-website-screenshots
          path: .local/console-lab/site-screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain tested public website
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: public-website
          path: dist-site/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
      - name: Download tested public website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: public-website
          path: dist-site/
      - name: Deploy production
        if: ${{ github.event_name == 'push' }}
        run: npx --yes wrangler@4.148.0 deploy --message "main ${GITHUB_SHA::7}"
      - name: Upload pull request preview
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@4.148.0 versions upload --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} ${GITHUB_SHA::7}" | tee upload.log
          {
            echo "### Cloudflare preview"
            grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' upload.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"